name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Validate vertical templates
        run: npm run saha:validate-verticals

      - name: Saha migration guard (paylaşımlı Parla DB politikası)
        continue-on-error: true
        run: npm run saha:check-migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Build için minimum env'ler — CI'da dummy değerler
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-key
          VITE_MAPBOX_PUBLIC_TOKEN: pk.ci-dummy
        run: npm run build

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  deploy-migrations:
    name: Deploy Supabase migrations
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-migrations-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Saha migration'ları idempotent yazılmış (CREATE TABLE IF NOT EXISTS,
      # CREATE OR REPLACE FUNCTION, DROP POLICY IF EXISTS). Parla shared DB
      # geçmişine dokunmamak için supabase CLI yerine direkt psql kullanıyoruz.
      # Sadece bu sprint'te değişen 2 dosyayı apply ediyoruz.
      # GitHub Actions IPv4-only; Supabase direct DB IPv6 sadece.
      # Supavisor pooler (aws-1-eu-central-1.pooler.supabase.com:6543) IPv4
      # transaction mode. Migration dosyaları BEGIN/COMMIT içeriyor → tek tx OK.
      - name: Apply migrations via Supavisor pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-1-eu-central-1.pooler.supabase.com
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_REF }}
          PGDATABASE: postgres
          PGPORT: '6543'
        run: |
          set -euo pipefail
          for f in \
            supabase/migrations/20260528000007_saha_route_assignment.sql \
            supabase/migrations/20260528000008_saha_auth_trigger.sql \
            supabase/migrations/20260528000009_saha_cari_sales_rep.sql \
            supabase/migrations/20260528000010_saha_scan_logs_v3_rep.sql; do
              echo "::group::Apply $f"
              psql --set ON_ERROR_STOP=on -v ON_ERROR_STOP=1 -f "$f"
              echo "::endgroup::"
          done

  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cf-workers-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22 (wrangler requires)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: https://rranpzicmhgfupgabgbi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9wnwTdO3WiIczkuKaLNnsg__CD2eUXW
          VITE_MAPBOX_PUBLIC_TOKEN: pk.eyJ1IjoiYWxpZXZyZW40NCIsImEiOiJjbXBtczg3cXowY2k0MnNzOWo2MzA1NDhvIn0.X8ehMO7Hg35KvUtan5VdDA
        run: npm run build

      - name: Deploy via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
