name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Validate vertical templates
        run: npm run saha:validate-verticals

      - name: Saha migration guard (paylaşımlı Parla DB politikası)
        continue-on-error: true
        run: npm run saha:check-migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Build için minimum env'ler — CI'da dummy değerler
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-key
          VITE_MAPBOX_PUBLIC_TOKEN: pk.ci-dummy
        run: npm run build

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  deploy-migrations:
    name: Deploy Supabase migrations
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-migrations-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Saha migration'ları idempotent yazılmış (CREATE TABLE IF NOT EXISTS,
      # CREATE OR REPLACE FUNCTION, DROP POLICY IF EXISTS). Parla shared DB
      # geçmişine dokunmamak için supabase CLI yerine direkt psql kullanıyoruz.
      # Sadece bu sprint'te değişen 2 dosyayı apply ediyoruz.
      # GitHub Actions IPv4-only; Supabase direct DB IPv6 sadece. Pooler (IPv4)
      # üzerinden session mode (port 5432) DDL'leri uygular. Region default
      # eu-central-1 (TR proximity); secret SUPABASE_POOLER_HOST varsa onu kullan.
      - name: Apply migrations via psql (pooler)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_REF }}
          PGDATABASE: postgres
          PGPORT: '5432'
        run: |
          set -euo pipefail
          if [ -z "${PGHOST:-}" ]; then
            PGHOST="aws-0-eu-central-1.pooler.supabase.com"
            export PGHOST
          fi
          echo "Connecting to ${PGHOST}:${PGPORT} as ${PGUSER}"
          for f in \
            supabase/migrations/20260528000007_saha_route_assignment.sql \
            supabase/migrations/20260528000008_saha_auth_trigger.sql; do
              echo "::group::Apply $f"
              psql --set ON_ERROR_STOP=on -v ON_ERROR_STOP=1 -f "$f"
              echo "::endgroup::"
          done
