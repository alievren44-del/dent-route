name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Validate vertical templates
        run: npm run saha:validate-verticals

      - name: Saha migration guard (paylaşımlı Parla DB politikası)
        continue-on-error: true
        run: npm run saha:check-migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Build için minimum env'ler — CI'da dummy değerler
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-key
          VITE_MAPBOX_PUBLIC_TOKEN: pk.ci-dummy
        run: npm run build

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  deploy-migrations:
    name: Deploy Supabase migrations
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-migrations-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Saha migration'ları idempotent yazılmış (CREATE TABLE IF NOT EXISTS,
      # CREATE OR REPLACE FUNCTION, DROP POLICY IF EXISTS). Parla shared DB
      # geçmişine dokunmamak için supabase CLI yerine direkt psql kullanıyoruz.
      # #110: Eskiden sadece 4 dosya hardcoded'dı → yeni migration eklenince
      # CI'da unutuluyordu. Artık tüm supabase/migrations/*.sql dosyaları
      # leksikografik (timestamp) sırayla apply ediliyor; idempotent oldukları
      # için tekrar çalıştırmak güvenli.
      # GitHub Actions IPv4-only; Supabase direct DB IPv6 sadece.
      # Supavisor pooler (aws-1-eu-central-1.pooler.supabase.com:6543) IPv4
      # transaction mode. Migration dosyaları BEGIN/COMMIT içeriyor → tek tx OK.
      - name: Apply migrations via Supavisor pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-1-eu-central-1.pooler.supabase.com
          PGUSER: postgres.${{ secrets.SUPABASE_PROJECT_REF }}
          PGDATABASE: postgres
          PGPORT: '6543'
        run: |
          set -uo pipefail
          # Tüm migration dosyalarını timestamp sırasıyla uygula (ls | sort).
          # NOT: ON_ERROR_STOP KALDIRILDI. Bu job TÜM geçmiş migration'ları her push'ta
          # yeniden uyguluyor (idempotent niyet). Eski dosyaların bir kısmı brute psql
          # re-apply'da kaçınılmaz "already exists" / "cannot change return type" verir
          # (objeler zaten canlı). ON_ERROR_STOP=on iken ilk böyle hatada job FAIL edip
          # her push'ta "run failed" mail atıyordu. Artık her dosya best-effort uygulanır;
          # zaten-var hataları zararsız (psql exit 0), yeni temiz statement'lar uygulanır.
          # Kritik helper fix'leri (20260525001/20260610000004) erken + standalone → uygulanır.
          # YENİ migration'lar MCP ile de uygulanmalı (bu job artık gate değil, best-effort).
          shopt -s nullglob
          fail=0
          for f in $(ls supabase/migrations/*.sql | sort); do
              echo "::group::Apply $f"
              psql -f "$f" || { echo "::warning::migration uyarı/atlandı: $f"; fail=1; }
              echo "::endgroup::"
          done
          echo "migration apply tamam (best-effort, fail-flag=$fail)"

  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cf-workers-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22 (wrangler requires)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: https://rranpzicmhgfupgabgbi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9wnwTdO3WiIczkuKaLNnsg__CD2eUXW
          VITE_MAPBOX_PUBLIC_TOKEN: pk.eyJ1IjoiYWxpZXZyZW40NCIsImEiOiJjbXBtczg3cXowY2k0MnNzOWo2MzA1NDhvIn0.X8ehMO7Hg35KvUtan5VdDA
        run: npm run build

      - name: Deploy via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
